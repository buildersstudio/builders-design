              - text: Can Corestone own the step between messy field and lab documents and the first table a geologist trusts, and is that step worth paying for?
          - generic [ref=e831]:
            - paragraph [ref=e832]: "Ten recorded calls, nine with learnings, agree on where the time goes: not in interpretation or modelling, but in getting field sheets, scanned logs and lab certificates into a table someone can trust. The E4 pains come from design-side geologists, a small drilling firm, mining and exploration geologists and a rail design manager, and they repeat across construction and mining: data arrives as PDF in almost every case, each lab uses its own layout, OCR mangles scans, logs carry errors that only a geologist's eye catches, and the checked data then has to be redrawn by hand. The one E5 is a data pack promised by a small drilling firm. The evidence is thin on who pays and how much: a client-side manager doubts anyone would buy a validation tool, and no specialist contractor has been interviewed for the tender-check angle."
