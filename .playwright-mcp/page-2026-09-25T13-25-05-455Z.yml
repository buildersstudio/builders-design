          - generic [ref=f7e692]:
            - heading "What would prove it wrong" [level=4] [ref=f7e693]
            - list [ref=f7e694]:
              - listitem [ref=f7e695]: Most reports find little that matters, so they read as a nice-to-have. Grade every flag by whether it would change a design parameter and lead with those.
              - listitem [ref=f7e696]: Checks that are rule-based are already free in AGS validators, so a report that only checks format has no value. The report must check content across files and against photos.
              - listitem [ref=f7e697]: Contractors see validation as another layer of cost; a client-side manager doubted anyone would pay. Sell it to the geologist who signs the data, not to the party being checked.
              - listitem [ref=f7e698]: False flags waste the reviewer's time and kill trust quickly. Track the share of flags the geologist accepts.
          - generic [ref=f7e699]:
            - heading "First move" [level=4] [ref=f7e700]
            - paragraph [ref=f7e701]: In the two weeks from 28 September, write the first twenty checks (hole length across files, depth order, units, values copied from certificates, coordinates against the site plan, logged RQD against photo estimate), run them on the first two data sets, and have one geologist grade every flag as real, trivial or wrong.
